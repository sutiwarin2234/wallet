<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>รายรับรายจ่าย</title>
<meta name="apple-mobile-web-app-title" content="รายรับรายจ่าย">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg: #f8fafc; --card: #ffffff; --line: #e2e8f0; --text: #020617; --muted: #475569; --accent: #0f172a; --on-accent: #ffffff; --err: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #020617; --card: #0f172a; --line: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #2563eb; --on-accent: #ffffff; --err: #f87171; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Sukhumvit Set", "Thonburi", system-ui, sans-serif; }
  /* แอปจริงเปิดเต็มจอ เว้นที่ให้แถบสถานะและขอบล่างของ iPhone */
  iframe {
    position: fixed; border: 0;
    top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); left: 0; right: 0;
    width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    background: var(--bg);
  }
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center; gap: 14px; transition: opacity .3s;
  }
  .screen img { width: 88px; height: 88px; border-radius: 20px; }
  .screen.hide { opacity: 0; pointer-events: none; }
  .muted { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 320px; }
  #setup input { width: 100%; max-width: 320px; box-sizing: border-box; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 14px; font-size: 15px; font-family: inherit; }
  #setup button { width: 100%; max-width: 320px; border: 0; border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 600;
    color: var(--on-accent); background: var(--accent); font-family: inherit; }
  #setupMsg.err { color: var(--err); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="screen" id="splash">
    <img src="apple-touch-icon.png" alt="">
    <div class="muted">กำลังเปิด…</div>
  </div>

  <!-- ตั้งค่าครั้งแรกในเครื่องนี้: ลิงก์ของแอปไม่ได้อยู่ในไฟล์นี้ เพื่อไม่ให้ใครเห็นจาก GitHub -->
  <div class="screen hidden" id="setup">
    <img src="apple-touch-icon.png" alt="">
    <b>ตั้งค่าครั้งแรก</b>
    <div class="muted" id="setupMsg">วางรหัสแอป (หรือลิงก์ที่ลงท้ายด้วย /exec) แล้วกดบันทึก ทำครั้งเดียวต่อเครื่อง</div>
    <input id="setupInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AKfy…">
    <button id="setupSave">บันทึก</button>
  </div>

  <iframe id="app" class="hidden" title="รายรับรายจ่าย" referrerpolicy="no-referrer"></iframe>

<script>
  var KEY = 'income-expense-app-id';

  function storeGet() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function storeSet(v) { try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; } }

  // รับได้ทั้งรหัส deployment (AKfy…) และลิงก์เต็ม …/macros/s/AKfy…/exec
  function parseId(text) {
    var m = String(text || '').trim().match(/(AKfy[\w-]{20,})/);
    return m ? m[1] : '';
  }

  function openApp(id) {
    var frame = document.getElementById('app');
    document.getElementById('setup').classList.add('hidden');
    frame.classList.remove('hidden');
    frame.addEventListener('load', function () {
      setTimeout(function () { document.getElementById('splash').classList.add('hide'); }, 300);
    });
    frame.src = 'https://script.google.com/macros/s/' + id + '/exec';
  }

  function showSetup(msg) {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('setup').classList.remove('hidden');
    if (msg) {
      var el = document.getElementById('setupMsg');
      el.textContent = msg;
      el.className = 'muted err';
    }
  }

  // ลิงก์ตั้งค่า: …/#setup=AKfy… (ส่วนหลัง # ไม่ถูกส่งไปที่เซิร์ฟเวอร์) แล้วลบออกจากแถบที่อยู่ทันที
  var fromHash = parseId((location.hash.match(/setup=([^&]+)/) || [])[1]);
  if (fromHash) {
    storeSet(fromHash);
    history.replaceState(null, '', location.pathname + location.search);
  }

  var id = fromHash || storeGet();
  if (id) openApp(id);
  else showSetup();

  document.getElementById('setupSave').addEventListener('click', function () {
    var v = parseId(document.getElementById('setupInput').value);
    if (!v) { showSetup('รหัสไม่ถูกต้อง ต้องขึ้นต้นด้วย AKfy'); return; }
    if (!storeSet(v)) { showSetup('บันทึกในเครื่องไม่ได้ ลองปิดโหมดส่วนตัวของ Safari'); return; }
    openApp(v);
  });
</script>
</body>
</html>
