<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>รายรับรายจ่าย</title>
<meta name="apple-mobile-web-app-title" content="รายรับรายจ่าย">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg: #f2f2f7; --muted: #8e8e93; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --muted: #98989f; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  /* แอปจริงเปิดเต็มจอ เว้นที่ให้แถบสถานะและขอบล่างของ iPhone */
  iframe {
    position: fixed; border: 0;
    top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); left: 0; right: 0;
    width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    background: var(--bg);
  }
  .splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Sukhumvit Set", "Thonburi", system-ui, sans-serif;
    color: var(--muted); font-size: 14px; gap: 14px; transition: opacity .3s;
  }
  .splash img { width: 88px; height: 88px; border-radius: 20px; }
  .splash.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="splash" id="splash">
    <img src="apple-touch-icon.png" alt="">
    <div>กำลังเปิด…</div>
  </div>
  <iframe id="app" title="รายรับรายจ่าย" allow="clipboard-write"></iframe>

<script>
  // URL ของเว็บแอป Apps Script (ถ้า Deploy ใหม่แล้ว URL เปลี่ยน ให้แก้ตรงนี้)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyiNA777G14-ZGaqXeb1AJ65dCzvbIkk_NriGm-ay6OxuMW-Hs73OA_lJ15QDzRm2xy/exec';
  var PIN_KEY = 'income-expense-pin';

  var frame = document.getElementById('app');
  frame.addEventListener('load', function () {
    setTimeout(function () { document.getElementById('splash').classList.add('hide'); }, 300);
  });
  frame.src = APP_URL;

  // แอปที่ฝังอยู่ขอ/บันทึก PIN ผ่านหน้านี้ เพราะหน้านี้เก็บข้อมูลในเครื่องได้ถาวรกว่าเฟรมที่ฝังไว้
  function fromApp(origin) { return /\.googleusercontent\.com$/.test(new URL(origin).hostname); }

  window.addEventListener('message', function (e) {
    if (!e.data || typeof e.data !== 'object' || !fromApp(e.origin)) return;
    var pin = '';
    if (e.data.type === 'ie-get-pin') {
      try { pin = localStorage.getItem(PIN_KEY) || ''; } catch (err) {}
      e.source.postMessage({ type: 'ie-pin', pin: pin }, e.origin);
    } else if (e.data.type === 'ie-set-pin') {
      try {
        if (e.data.pin) localStorage.setItem(PIN_KEY, String(e.data.pin));
        else localStorage.removeItem(PIN_KEY);
      } catch (err) {}
    }
  });
</script>
</body>
</html>
